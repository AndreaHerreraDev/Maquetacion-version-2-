<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Iniciar Sesión - Mundo Mascota</title>
    <link rel="stylesheet" type="text/css" href="../css/estilos-formulario.css">
</head>

<body>
    <!--Main-->
    <div class="main">
        <!-- Título temático -->
        <h1>Acceso al Sistema Mascota</h1>
        
        <div class="row">
            <div class="form-p">
                <form action="../si/1.admin/html/index-admin.html" method="get">
                    
                    <div class="input-group">
                        <label>Usuario / Email</label>
                        <input class="text" type="text" placeholder="Ingresa tu usuario" name="Username" required>
                    </div>

                    <div class="input-group">
                        <label>Contraseña</label>
                        <input class="text" type="password" placeholder="Tu clave secreta" name="Password" required>
                    </div>

                    <input type="submit" value="Entrar al Panel">
                </form>

                <div class="links-ayuda">
                    <p><a href="#">¿Olvidaste tu contraseña?</a></p>
                    <a href="../index.html">Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
